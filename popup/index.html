<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Antigravity Scraper</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Antigravity Curation</h1>
    </header>

    <section class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin: 0;">Add Category</h2>
        <div>
          <button id="export-btn" class="utility-btn">Export</button>
          <button id="import-btn" class="utility-btn">Import</button>
          <input type="file" id="import-file" accept=".json" style="display: none;">
        </div>
      </div>
      <div class="input-group">
        <input type="text" id="new-category-name" placeholder="E.g., Tech News">
        <button id="add-category-btn">Add Category</button>
      </div>
    </section>

    <div id="categories-container">
      <!-- Categories will be injected here dynamically -->
    </div>

    <section class="section settings-section">
      <h2>General Settings</h2>
      <div class="input-group">
        <label for="llm-provider">Hugging Face Free API Token:</label>
        <input type="password" id="llm-api-key" placeholder="hf_...">
      </div>
      <div class="input-group">
        <label for="email-api-key">Google Apps Script Webhook URL:</label>
        <input type="password" id="email-api-key" placeholder="https://script.google.com/macros/s/...">
      </div>
      <div class="input-group">
        <label for="recipient-email">Recipient Email:</label>
        <input type="email" id="recipient-email" placeholder="you@example.com">
      </div>
      <div class="input-group" style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
        <label for="scrape-duration" style="white-space: nowrap; margin-bottom: 0;">Scrape Duration:</label>
        <input type="number" id="scrape-duration" placeholder="24" style="width: 80px;" min="1" value="24">
        <select id="scrape-duration-unit" style="padding: 8px; border-radius: 4px; border: 1px solid #d1d5db; height: 38px;">
          <option value="hours">Hours</option>
          <option value="days">Days</option>
        </select>
      </div>
      <div style="margin-bottom: 10px;">
        <label
          style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #4b5563;">
          <input type="checkbox" id="allow-duplicates">
          Allow processing previously emailed tweets
        </label>
      </div>
      <div class="input-group" style="margin-bottom: 20px;">
        <label
          style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #4b5563; margin-bottom: 8px;">
          <input type="checkbox" id="enable-schedule">
          Enable Daily Scheduled Run
        </label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="time" id="schedule-time" style="flex: 1;">
        </div>
      </div>
      <button id="save-settings-btn" class="primary-btn">Save Settings & Start Scraping</button>
      <div id="status-message"></div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>

</html>
