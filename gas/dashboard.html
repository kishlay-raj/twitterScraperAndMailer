*{box-sizing:border-box;margin:0;padding:0}

<script>
let digestData = [], projectData = [];
let activeCat  = 'all', activeTab = 'digest';
let deepLinkHandled = false;
let dateFilterInitialized = false;

// Dynamically determine base URL from document.referrer if possible to handle wildcard /a/*/ routing.
let derivedGasUrl = '';
try {
  const ref = document.referrer;
  if (ref && (ref.indexOf('/macros/s/') !== -1 || ref.indexOf('/a/') !== -1)) {
    const idx = ref.indexOf('/exec');
    if (idx !== -1) {
      derivedGasUrl = ref.substring(0, idx + 5);
    } else {
      derivedGasUrl = ref;
    }
  }
} catch (_) {}

const GAS_URL = derivedGasUrl || '<?!= typeof gasUrl !== "undefined" ? gasUrl : "" ?>';

// Detect Safari / iOS to bypass standard google.script.run
const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent) || 
                 /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// JSONP helper for cross-origin GET requests to GAS backend
function callGasApiJsonp(params, onSuccess, onError) {
  if (!GAS_URL || GAS_URL.startsWith('<' + '?')) {
    if (onError) onError(new Error("GAS_URL is not defined or invalid."));
    return;
  }
  
  const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
  
  window[cbName] = function(data) {
    cleanup();
    if (onSuccess) onSuccess(data);
  };
  
  const script = document.createElement('script');
  const scriptId = 'jsonp_script_' + cbName;
  script.id = scriptId;
  
  function cleanup() {
    try {
      delete window[cbName];
    } catch (_) {}
    const el = document.getElementById(scriptId);
    if (el) el.remove();
  }
  
  script.onerror = function() {
    cleanup();
    if (onError) onError(new Error("JSONP request failed (network error or blocked)."));
  };
  
  const queryParams = new URLSearchParams(params);
  queryParams.set('callback', cbName);
  
  script.src = GAS_URL + '?' + queryParams.toString();
  document.body.appendChild(script);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function initDateFilter() {
  if (dateFilterInitialized) return;
  const dateEl = document.getElementById('digest-date-filter');
  if (!dateEl) return;
  
  const formatLocalDate = (d) => {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  };
  
  const todayStr = formatLocalDate(new Date());
  
  const hasDateData = (dateStr) => {
    return digestData.some(d => {
      try {
        const itemDateStr = formatLocalDate(new Date(d.timestamp));
        return itemDateStr === dateStr;
      } catch (_) {
        return false;
      }
    });
  };
  
  if (hasDateData(todayStr)) {
    dateEl.value = todayStr;
  } else if (digestData && digestData.length > 0) {
    try {
      dateEl.value = formatLocalDate(new Date(digestData[0].timestamp));
    } catch (_) {
      dateEl.value = todayStr;
    }
  } else {
    dateEl.value = todayStr;
  }
  dateFilterInitialized = true;
}

function loadData() {
  const useJsonp = function() {
    callGasApiJsonp(
      { action: 'getDigestData' },
      function(d) {
        digestData = d;
        initDateFilter();
        renderDigest();
        updateBadge('digest');
      },
      function(err) {
        console.error('JSONP failed:', err);
        document.getElementById('digest-feed').innerHTML = '<div class="empty">❌ Failed to load digest: ' + err.message + '</div>';
      }
    );
  };

  if (!isSafari && typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(d => {
        digestData = d;
        initDateFilter();
        renderDigest();
        updateBadge('digest');
      })
      .withFailureHandler(e => {
        console.warn('google.script.run getDigestData failed, trying JSONP...', e);
        useJsonp();
      })
      .getDigestData();
  } else {
    useJsonp();
  }
}

// ── FILTER ──────────────────────────────────────────────────────────────

function filterCat(el, tab) {
  document.querySelectorAll('#digest-filters .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeCat = el.dataset.cat;
  renderDigest();
}

function stepDate(type, offset) {
  const el = document.getElementById(type + '-date-filter');
  let d;
  if (offset === 0 || !el.value) {
    d = new Date();
  } else {
    const parts = el.value.split('-');
    d = new Date(parts[0], parts[1] - 1, parts[2]);
    d.setDate(d.getDate() + offset);
  }
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  el.value = `${yyyy}-${mm}-${dd}`;
  
  if (type === 'digest') renderDigest();
  else renderProject();
}

// ── RENDER DIGEST ─────────────────────────────────────────────────────────────
function renderDigest() {
  const unreadOnly = document.getElementById('unread-only-digest').checked;
  let dateFilter = document.getElementById('digest-date-filter').value;
  
  // Deep-Link check: check if we have a target in query params
  const urlParams = new URLSearchParams(window.location.search);
  const targetDigestId = urlParams.get('digest');
  const targetVideoId = urlParams.get('video');
  
  let targetItem = null;
  let shouldScroll = false;
  if ((targetDigestId || targetVideoId) && !deepLinkHandled) {
    if (targetDigestId) {
      targetItem = digestData.find(d => String(d.runId) === String(targetDigestId));
    } else if (targetVideoId) {
      for (const d of digestData) {
        if (d.tweets && d.tweets.some(t => String(t.id) === String(targetVideoId))) {
          targetItem = d;
          break;
        }
        if (d.profiles) {
          for (const p of d.profiles) {
            if (p.tweets && p.tweets.some(t => String(t.id) === String(targetVideoId))) {
              targetItem = d;
              break;
            }
          }
        }
        if (targetItem) break;
      }
    }

    if (targetItem) {
      // Clear filters that might hide the target item
      if (unreadOnly && targetItem.isRead) {
        document.getElementById('unread-only-digest').checked = false;
      }
      if (activeCat !== 'all' && targetItem.category !== activeCat) {
        activeCat = 'all';
        document.querySelectorAll('#digest-filters .chip').forEach(c => {
          if (c.dataset.cat === 'all') c.classList.add('active');
          else c.classList.remove('active');
        });
      }
      
      if (dateFilter) {
        const formatLocalDate = (d) => {
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        };
        const itemDateStr = formatLocalDate(new Date(targetItem.timestamp));
        if (itemDateStr !== dateFilter) {
          document.getElementById('digest-date-filter').value = '';
          dateFilter = '';
        }
      }
      deepLinkHandled = true;
      shouldScroll = true;
    }
  }

  let items = digestData;
  if (activeCat !== 'all') items = items.filter(d => d.category === activeCat);
  if (document.getElementById('unread-only-digest').checked) items = items.filter(d => !d.isRead);
  if (dateFilter) {
    items = items.filter(d => {
      try { return new Date(d.timestamp).toISOString().slice(0,10) === dateFilter; }
      catch(_) { return false; }
    });
  }

  const feed = document.getElementById('digest-feed');
  if (!items.length) { feed.innerHTML = '<div class="empty">📭 No digest updates found.</div>'; return; }
  feed.innerHTML = items.map(d => digestCard(d)).join('');

  // Rebuild category chips
  const cats = [...new Set(digestData.map(d => d.category))];
  const fc   = document.querySelector('.cat-filter-scroll');
  const chips = fc.querySelectorAll('.chip');
  chips.forEach(c => { if (c.dataset.cat !== 'all') c.remove(); });
  cats.forEach(cat => {
    const c = document.createElement('span');
    c.className = 'chip' + (cat === activeCat ? ' active' : '');
    c.dataset.cat = cat; c.textContent = cat;
    c.onclick = () => filterCat(c, 'digest');
    fc.appendChild(c);
  });

  // Handle scrolling to deep-linked card
  if (shouldScroll && targetItem) {
    setTimeout(() => {
      const cardEl = document.getElementById('card-' + targetItem.runId);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // Expand the full analysis
        const expandBtn = cardEl.querySelector('.btn-expand');
        if (expandBtn) {
          const deepSec = cardEl.querySelector('.deep-section');
          if (deepSec && !deepSec.classList.contains('open')) {
            toggleDeep(expandBtn, 'deep-' + targetItem.runId);
          }
        }
        
        // If it's a target video, expand the tweets section containing it
        if (targetVideoId) {
          const activeProfiles = targetItem.profiles.filter(p => (p.tweets && p.tweets.length > 0) || p.aiSummary);
          const inactiveProfiles = targetItem.profiles.filter(p => !((p.tweets && p.tweets.length > 0) || p.aiSummary));
          
          let actIdx = activeProfiles.findIndex(p => p.tweets && p.tweets.some(t => String(t.id) === String(targetVideoId)));
          let suffix = '';
          let tweetCount = 0;
          if (actIdx !== -1) {
            suffix = `act-${actIdx}`;
            tweetCount = activeProfiles[actIdx].tweets.length;
          } else {
            let inactIdx = inactiveProfiles.findIndex(p => p.tweets && p.tweets.some(t => String(t.id) === String(targetVideoId)));
            if (inactIdx !== -1) {
              suffix = `inact-${inactIdx}`;
              tweetCount = inactiveProfiles[inactIdx].tweets.length;
            }
          }
          
          if (suffix) {
            const tbId = `tweets-${targetItem.runId}-${suffix}`;
            const btn = cardEl.querySelector(`button[onclick*="${tbId}"]`);
            if (btn) {
              toggleTweets(btn, tbId, tweetCount);
            }
          }
        }
      }
    }, 150);
  }
}

function digestCard(d) {
  const ts   = fmtDate(d.timestamp);
  const dot  = d.isRead ? '<span class="read-dot"></span>' : '<span class="unread-dot"></span>';
  const goss = d.glossary && d.glossary.length ? glossaryChips(d.glossary) : '';
  const readBtn = d.isRead ? '' : `<button class="mark-read-btn" onclick="event.stopPropagation(); markRead('${esc(d.runId)}','digest',this)">✓ Mark Read</button>`;
  const cleanDeep = (d.deepSummaryHtml || '').replace(/<\/?(?:tr|td|table|tbody)[^>]*>/gi, '');
  return `
<div class="card ${d.isRead?'read':'unread'}" id="card-${esc(d.runId)}">
  <div class="card-header" style="cursor:pointer; user-select:none; padding-bottom:14px;" onclick="const content = this.nextElementSibling; content.style.display = content.style.display === 'none' ? 'block' : 'none'; this.querySelector('.card-toggle-icon').textContent = content.style.display === 'none' ? '▼' : '▲';">
    <div class="card-meta">
      <span class="card-toggle-icon" style="font-size:10px;color:#9ca3af;margin-right:4px;">▲</span>
      ${dot}<span class="cat-badge">${esc(d.category)}</span><span class="ts">${ts}</span>
    </div>
    ${readBtn}
  </div>
  <div class="card-content-wrapper" style="display:block;">
    <div class="card-body" style="padding-top:0;">${d.briefSummary || '<em style="color:#9ca3af">No summary.</em>'}</div>
    ${goss || cleanDeep ? `
    <div class="card-actions">
      ${cleanDeep ? `<button class="btn-expand" onclick="toggleDeep(this,'deep-${esc(d.runId)}')">📖 Full Analysis ▼</button>` : ''}
      <div class="glossary-chips">${goss}</div>
    </div>
    <div class="deep-section" id="deep-${esc(d.runId)}">
      ${cleanDeep}
      ${profilesSection(d)}
    </div>` : ''}
  </div>
</div>`;
}

function profilesSection(d) {
  if (!d.profiles || !d.profiles.length) return '';
  let html = '<div class="section-title">📋 Profiles</div>';
  const activeProfiles = d.profiles.filter(p => (p.tweets && p.tweets.length > 0) || p.aiSummary);
  const inactiveProfiles = d.profiles.filter(p => !((p.tweets && p.tweets.length > 0) || p.aiSummary));

  const renderProfile = (p, idx, isInactive) => {
    const avFallback = `<div class="avatar-fallback">${(p.name||p.handle||'?')[0].toUpperCase()}</div>`;
    const avatar = p.avatarUrl
      ? `<img class="avatar" src="${esc(p.avatarUrl)}" onerror="this.style.display='none'" alt="">`
      : avFallback;
    const tweets = (p.tweets || []).slice(0,10);
    const tweetsHtml = tweets.length 
      ? tweets.map(t => renderTweetCard(t)).join('')
      : '';
      
    const tbId = `tweets-${esc(d.runId)}-${idx}`;
    const aiSummaryHtml = p.aiSummary ? `<div style="background:#f0fdf4; border-left:3px solid #22c55e; padding:10px 14px; margin-top:10px; font-size:13px; color:#1c1917; line-height:1.6; border-radius:4px;"><div style="font-size:11px; font-weight:700; color:#15803d; text-transform:uppercase; margin-bottom:4px;">✨ Profile Summary</div>${p.aiSummary}</div>` : '';

    return `<div class="profile-block" ${isInactive ? 'style="padding:8px 12px; margin-bottom:8px;"' : ''}>
      <div class="profile-meta" style="justify-content:space-between; margin-bottom:0;">
        <div style="display:flex; align-items:center; gap:10px;">
          ${avatar}
          <div><div class="profile-name" ${isInactive ? 'style="font-size:13px;"' : ''}>${esc(p.name||p.handle||'Profile')}</div>
          <div class="profile-handle"><a href="${esc(p.url)}" target="_blank">${esc(p.handle||p.url)}</a></div></div>
        </div>
        ${tweets.length ? `<button class="btn-expand" style="font-size:10px; padding:4px 8px; background:#f3f4f6; border-color:#e5e7eb; color:#4b5563;" onclick="toggleTweets(this, '${tbId}', ${tweets.length})">Show Tweets (${tweets.length}) ▼</button>` : (isInactive ? '<span style="font-size:11px; color:#9ca3af; font-weight:600;">No updates</span>' : '')}
      </div>
      ${aiSummaryHtml}
      ${tweets.length ? `<div id="${tbId}" style="display:none; margin-top:12px; border-top:1px solid #f3f4f6;">${tweetsHtml}</div>` : ''}
    </div>`;
  };

  activeProfiles.forEach((p, idx) => {
    html += renderProfile(p, `act-${idx}`, false);
  });

  if (inactiveProfiles.length > 0) {
    html += `
    <div style="margin-top:16px; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; background:#f9fafb;">
      <div style="padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:#4b5563; user-select:none;" onclick="const el=this.nextElementSibling; el.style.display=el.style.display==='none'?'block':'none'; this.querySelector('span:last-child').textContent=el.style.display==='none'?'▼':'▲';">
        <span>Profiles with no new tweets (${inactiveProfiles.length})</span>
        <span style="font-size:10px; color:#9ca3af;">▼</span>
      </div>
      <div style="display:none; padding:0 14px 6px 14px;">
        ${inactiveProfiles.map((p, idx) => renderProfile(p, `inact-${idx}`, true)).join('')}
      </div>
    </div>`;
  }
  return html;
}



// ── RICH TWEET CARD ───────────────────────────────────────────────────────────
function renderTweetCard(t) {
  let badges = '';
  if (t.isRetweet) badges += `<span class="tweet-badge badge-rt">🔁 Repost${t.authorName ? ' from ' + esc(t.authorName) : ''}</span>`;
  if (t.isSubscriberOnly) badges += `<span class="tweet-badge badge-sub">⭐ Subscribers Only</span>`;

  let replyHtml = '';
  if (t.replyContext) {
    replyHtml = `<div class="tweet-reply-ctx">
      <div class="reply-author">↩️ Replying to <span>${esc(t.replyContext.authorHandle || t.replyContext.authorName || '')}</span></div>
      <div class="reply-text">${esc(t.replyContext.text || '')}</div>
    </div>`;
  }

  let quoteHtml = '';
  if (t.quotedTweet) {
    quoteHtml = `<div class="tweet-quote">
      <div class="qt-author">🔗 Quoted · ${esc(t.quotedTweet.authorName || '')} ${esc(t.quotedTweet.authorHandle || '')}</div>
      <div class="qt-text">${esc(t.quotedTweet.text || '')}</div>
    </div>`;
  }

  let mediaHtml = '';
  if (t.mediaUrls && t.mediaUrls.length > 0) {
    mediaHtml = `<div class="tweet-media">${t.mediaUrls.map(u => `<img src="${esc(u)}" alt="media" onerror="this.style.display='none'" loading="lazy">`).join('')}</div>`;
  }

  return `<div class="tweet-row">
    <div class="tweet-ts">🕒 ${fmtDate(t.timestamp)} ${badges}</div>
    ${replyHtml}
    <div class="tweet-text">${esc(t.text)}</div>
    ${quoteHtml}
    ${mediaHtml}
    <a class="tweet-link" href="${esc(t.url)}" target="_blank">View on X →</a>
  </div>`;
}

// ── GLOSSARY TOOLTIPS ─────────────────────────────────────────────────────────
function glossaryChips(glossary) {
  return glossary.slice(0,6).map(g =>
    `<span class="g-chip" onclick="this.classList.toggle('tip-open')">${esc(g.term)}<span class="g-tip">${esc(g.definition)}</span></span>`
  ).join('');
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function toggleDeep(btn, id) {
  const el = document.getElementById(id);
  const open = el.classList.toggle('open');
  btn.textContent = open ? '📖 Full Analysis ▲' : '📖 Full Analysis ▼';
}

function toggleTweets(btn, id, count) {
  const el = document.getElementById(id);
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? 'Hide Tweets ▲' : `Show Tweets (${count}) ▼`;
}

function markRead(id, type, btn) {
  // 1. Optimistic UI update (execute immediately for instant response)
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.remove('unread'); card.classList.add('read'); }
  if (btn) btn.remove();
  if (type === 'digest') {
    const item = digestData.find(d => d.runId === id);
    if (item) item.isRead = true;
  } else {
    const item = projectData.find(p => p.updateId === id);
    if (item) item.isRead = true;
  }
  updateBadge(type === 'digest' ? 'digest' : 'project');

  // 2. Background sync
  const useJsonp = function() {
    callGasApiJsonp(
      { markRead: id, type: type },
      function(res) {
        console.log('Background markRead synced:', res);
      },
      function(err) {
        console.error('Optimistic background markRead sync failed:', err);
      }
    );
  };

  if (!isSafari && typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withFailureHandler(e => {
        console.warn('google.script.run markAsRead failed, trying JSONP...', e);
        useJsonp();
      })
      .markAsRead(id, type);
  } else {
    useJsonp();
  }
}

function markAllRead() {
  // 1. Optimistic UI update
  digestData.forEach(d => d.isRead = true); 
  renderDigest();
  updateBadge('digest');

  // 2. Background sync
  const useJsonp = function() {
    callGasApiJsonp(
      { action: 'markAllAsRead', type: 'digest' },
      function(res) {
        console.log('Background markAllAsRead synced:', res);
      },
      function(err) {
        console.error('Optimistic background markAllAsRead failed:', err);
      }
    );
  };

  if (!isSafari && typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withFailureHandler(e => {
        console.warn('google.script.run markAllAsRead failed, trying JSONP...', e);
        useJsonp();
      })
      .markAllAsRead('digest');
  } else {
    useJsonp();
  }
}

function updateBadge(type) {
  const count = digestData.filter(d => !d.isRead).length;
  const el = document.getElementById('badge-digest');
  if (el) {
    el.textContent = count;
    el.className = 'badge' + (count === 0 ? ' zero' : '');
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmtDate(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 3600)  return Math.round(diff/60) + 'm ago';
    if (diff < 86400) return Math.round(diff/3600) + 'h ago';
    return d.toLocaleDateString([], {month:'short',day:'numeric'});
  } catch(_) { return String(ts); }
}

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── DARK MODE ─────────────────────────────────────────────────────────────────
function toggleDark() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  setDark(!isDark);
}
function setDark(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('dark-btn');
  if (btn) btn.textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('du_theme', dark ? 'dark' : 'light'); } catch(_) {}
}

// ── TIMEOUT TIMER SYSTEM ──────────────────────────────────────────────────────
let countdownSeconds = 300; // 5 minutes
let elapsedTimeoutSeconds = 0;
let countdownInterval = null;
let timeoutInterval = null;

function startCountdown() {
  clearInterval(countdownInterval);
  clearInterval(timeoutInterval);
  
  countdownSeconds = 300;
  updateCountdownDisplay();
  
  const timerBadge = document.getElementById('countdown-timer');
  if (timerBadge) {
    timerBadge.classList.remove('warning');
  }
  
  countdownInterval = setInterval(() => {
    countdownSeconds--;
    updateCountdownDisplay();
    
    if (countdownSeconds <= 60 && timerBadge) {
      timerBadge.classList.add('warning');
    }
    
    if (countdownSeconds <= 0) {
      clearInterval(countdownInterval);
      triggerTimeout();
    }
  }, 1000);
}

function updateCountdownDisplay() {
  const display = document.getElementById('timer-display');
  if (!display) return;
  const mins = Math.floor(countdownSeconds / 60);
  const secs = countdownSeconds % 60;
  display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function triggerTimeout() {
  const modal = document.getElementById('timeout-modal');
  if (modal) {
    modal.showModal();
  }
  
  elapsedTimeoutSeconds = 0;
  updateTimeoutElapsedDisplay();
  
  clearInterval(timeoutInterval);
  timeoutInterval = setInterval(() => {
    elapsedTimeoutSeconds++;
    updateTimeoutElapsedDisplay();
  }, 1000);
}

function updateTimeoutElapsedDisplay() {
  const display = document.getElementById('timeout-elapsed');
  if (!display) return;
  const mins = Math.floor(elapsedTimeoutSeconds / 60);
  const secs = elapsedTimeoutSeconds % 60;
  display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function resetTimer() {
  const modal = document.getElementById('timeout-modal');
  if (modal) {
    modal.close();
  }
  startCountdown();
}

function resetCountdownOnActivity() {
  const modal = document.getElementById('timeout-modal');
  if (modal && modal.open) return;

  countdownSeconds = 300;
  updateCountdownDisplay();
  const timerBadge = document.getElementById('countdown-timer');
  if (timerBadge) {
    timerBadge.classList.remove('warning');
  }
}

// Reset timer on user activity
['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (countdownSeconds < 295) {
      resetCountdownOnActivity();
    }
  }, { passive: true });
});

// Setup dialog cancel/escape handler
document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('timeout-modal');
  if (modal) {
    modal.addEventListener('cancel', (e) => {
      e.preventDefault();
      resetTimer();
    });
  }
});

// ── BOOT ──────────────────────────────────────────────────────────────────────
(function() {
  try {
    const saved = localStorage.getItem('du_theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setDark(saved ? saved === 'dark' : prefersDark);
  } catch(_) {}
})();

let initialDataParsed = false;
try {
  const initialDataEl = document.getElementById('initial-data');
  if (initialDataEl) {
    const rawContent = initialDataEl.textContent.trim();
    if (rawContent && !rawContent.startsWith('<' + '?')) {
      digestData = JSON.parse(rawContent);
      if (Array.isArray(digestData) && digestData.length > 0) {
        initialDataParsed = true;
      }
    }
  }
} catch (e) {
  console.error("Failed to parse embedded initialData:", e);
}

if (initialDataParsed) {
  initDateFilter();
  renderDigest();
  updateBadge('digest');
} else {
  loadData();
}

// Start the 5 minutes countdown session timer
startCountdown();
</script>

<dialog id="timeout-modal">
  <div class="modal-content">
    <div class="modal-icon">⏰</div>
    <div class="modal-title">Session Timeout</div>
    <p class="modal-body">Your session has timed out. Time elapsed since timeout:</p>
    <div class="timeout-clock" id="timeout-elapsed">00:00</div>
    <button class="modal-btn" onclick="resetTimer()">Extend Session</button>
  </div>
</dialog>

</body>
</html>
